# Main experiment configuration
# CIFAR-10-LT

dataset: cifar10

num_classes: 10

# Federated setting
num_clients: 20
num_online_clients: 8

# Long-tail setting
imb_factor: 0.01
non_iid_alpha: 0.5
rs_alpha: 0.5

# Training
num_rounds: 200
local_epochs: 10
batch_size: 32
lr: 0.1

# Model
model: resnet8

# Seed
seed: 42

device: cuda


# FedTIG modules
semantic_sampling: true
confidence_adjustment: true
tail_aggregation: true