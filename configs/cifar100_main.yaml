# Main experiment configuration
# CIFAR-100-LT


dataset: cifar100

num_classes: 100


# Federated setting
num_clients: 20
num_online_clients: 8


# Long-tail setting
imb_factor: 0.02
non_iid_alpha: 0.5
rs_alpha: 0.25


# Training
num_rounds: 200
local_epochs: 5
batch_size: 32
lr: 0.1


# Model
model: resnet8


seed: 42

device: cuda


# FedTIG modules
semantic_sampling: true
confidence_adjustment: true
tail_aggregation: true